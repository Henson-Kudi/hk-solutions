# Local development infrastructure. Not for production.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --wait
#   docker compose -f deploy/compose/docker-compose.yml down        # keep data
#   docker compose -f deploy/compose/docker-compose.yml down -v     # wipe data
#
# Defaults work as they are. To change a port or password, copy .env.example to
# .env in this folder (it is gitignored).

name: hk-solutions

services:
  postgres:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HK_PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${HK_PG_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${HK_PG_DATABASE:-hk}
    ports:
      # Loopback only: a dev database with a default password must not be
      # reachable from the network. Host port 54320 avoids a clash with a
      # Postgres already installed on the machine.
      - '127.0.0.1:${HK_PG_PORT:-54320}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs noeviction: when memory is full Redis must refuse writes,
    # never drop queued jobs. appendonly keeps the queues across restarts.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:${HK_REDIS_PORT:-63790}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
